name: Update boat maps

on:
  schedule:
    # Backup only: GitHub often delays or drops scheduled runs. Runs are normally started every
    # 15 min by an external scheduler (cron-job.org) calling the workflow_dispatch API.
    - cron: "7,37 * * * *"  # off the busy :00/:30 marks
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Short-lived credentials for the private AIS archive; the role may only s3:PutObject under ais/.
      # A login failure must not stop the pages updating: build_site.py then just warns that archiving was skipped.
      - uses: aws-actions/configure-aws-credentials@v6
        continue-on-error: true
        with:
          role-to-assume: arn:aws:iam::648183724555:role/ais-shipnoise-writer
          aws-region: us-west-2

      - name: Fetch boats and build pages
        env:
          AISHUB_USERNAME: ${{ secrets.AISHUB_USERNAME }}
          MPLBACKEND: Agg
        run: python build_site.py --out _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
